<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Bedroom Brawl — 2P Local Versus</title>
<style>
  html,body{margin:0;height:100%;background:#0c0714;overflow:hidden;touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  body{position:fixed;inset:0}
  canvas{display:block;image-rendering:auto;touch-action:none}
  #c{position:absolute;box-shadow:0 0 60px #6b3fd0aa}
  #pad{position:fixed;left:0;top:0;pointer-events:none;z-index:2}
  #sa{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .ui{position:fixed;z-index:3;display:none;flex-direction:column;align-items:center;gap:10px;transform:translate(-50%,-50%)}
  .ui button,#pauseBtn{font:900 18px system-ui,'Segoe UI',sans-serif;letter-spacing:.5px;color:#fff;min-width:170px;min-height:48px;padding:10px 22px;
    border-radius:14px;border:2px solid rgba(255,255,255,.55);background:rgba(60,25,110,.72);box-shadow:0 0 18px rgba(255,127,208,.45);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);cursor:pointer;touch-action:manipulation}
  .ui button.pri{background:rgba(255,95,170,.78);border-color:#ffe26a;color:#fff}
  .ui button:active,#pauseBtn:active{transform:scale(.96);filter:brightness(1.25)}
  .ui .nh{font:900 22px Impact,'Arial Black',system-ui;letter-spacing:1px;color:#ffe26a;text-shadow:0 0 12px #ff7fd0,0 2px 0 #1a0830}
  .ui .ncode{font:900 46px Impact,'Arial Black',system-ui;letter-spacing:8px;color:#fff;padding:6px 18px 4px 26px;border-radius:14px;background:rgba(20,8,40,.75);border:2px solid #ff7fd0;box-shadow:0 0 22px rgba(255,127,208,.6);user-select:all;-webkit-user-select:all}
  .ui .nlink{font:600 12px system-ui;color:#e8deff;max-width:300px;word-break:break-all;text-align:center;background:rgba(15,5,35,.6);padding:4px 8px;border-radius:8px;user-select:all;-webkit-user-select:all}
  .ui .nst{font:700 14px system-ui;color:#fff;max-width:320px;text-align:center;background:rgba(15,5,35,.65);padding:6px 10px;border-radius:10px;text-shadow:0 1px 2px #000}
  .ui .nst.err{color:#ffb3c0;border:1px solid #ff5d74}
  .ui .nrow{display:flex;gap:8px;align-items:center;justify-content:center}
  .ui .nrow button{min-width:0}
  .ui input{font:900 22px system-ui;letter-spacing:4px;text-transform:uppercase;text-align:center;width:150px;height:44px;border-radius:12px;border:2px solid rgba(255,255,255,.6);background:rgba(20,8,40,.8);color:#fff;outline:none;touch-action:manipulation;user-select:text;-webkit-user-select:text}
  .ui input:focus{border-color:#ffe26a;box-shadow:0 0 12px #ffe26a}
  #pauseBtn{position:fixed;z-index:3;display:none;min-width:0;min-height:0;width:46px;height:46px;padding:0;font-size:16px;border-radius:12px;background:rgba(30,12,60,.6)}
</style>

const IMG={};let loaded=0;const names=Object.keys(ASSETS);
function loadAll(cb){names.forEach(n=>{const i=new Image();i.onload=()=>{if(++loaded===names.length)cb();};i.src=ASSETS[n];IMG[n]=i;});}

// ---------- audio ----------
let AC=null,NOISE=null;
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return;}try{AC=new (window.AudioContext||window.webkitAudioContext)();
  NOISE=AC.createBuffer(1,AC.sampleRate*0.3,AC.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){}}
function tone(f,dur,type='square',vol=0.08,slide=0){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur);}
function noise(dur,vol=0.12,freq=1200){if(!AC)return;const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=NOISE;f.type='bandpass';f.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+dur);}
const SFX={
  whiff:()=>noise(0.08,0.05,2500),
  hit:(big)=>{noise(big?0.22:0.12,big?0.25:0.16,big?600:1000);tone(big?90:140,big?0.25:0.12,'sine',0.25,-60);},
  block:()=>{tone(700,0.06,'square',0.05);noise(0.05,0.06,3000);},
  special:(w)=>{tone(w?660:220,0.3,'sawtooth',0.06,w?600:-120);},
  jump:()=>tone(300,0.1,'triangle',0.05,200),
  ko:()=>{tone(200,0.9,'sawtooth',0.1,-170);noise(0.5,0.2,400);},
  beep:(f=880)=>tone(f,0.12,'square',0.06),
};

const down=new Set(),pressed=new Set();
const PREVENT=new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Semicolon','Tab','Quote']);
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT'){if(e.key==='Enter'&&ACTIONS.join)ACTIONS.join();return;}initAudio();if(PREVENT.has(e.code)||e.code.startsWith('Numpad'))e.preventDefault();if(!e.repeat)pressed.add(e.code);down.add(e.code);});
addEventListener('keyup',e=>down.delete(e.code));
addEventListener('blur',()=>{down.clear();TP.clear();});

// pose keys: lean,hipDy,bt,bs,ft,fs,bu,bf,fu,ff,head
const BASE={lean:0.06,hipDy:0,bt:-0.28,bs:-0.08,ft:0.3,fs:0.02,bu:0.3,bf:2.3,fu:0.5,ff:2.45,head:0};
function P(o){return Object.assign({},BASE,o);}
function lerp(a,b,t){return a+(b-a)*t;}
function targetPose(f){
  const t=f.anim;const br=Math.sin(t*0.08)*0.03;
  switch(f.state){
  case 'idle':return P({hipDy:2+Math.sin(t*0.08)*2,fu:0.5+br,bu:0.3-br,lean:0.06+br*0.5});
  case 'walk':{const p=t*0.22,s=Math.sin(p);return P({bt:-0.05+s*0.42,ft:0.08-s*0.42,bs:-0.05+s*0.42-0.25*Math.max(0,-s),fs:0.08-s*0.42-0.25*Math.max(0,s),hipDy:Math.abs(Math.cos(p))*3});}
  case 'jump':return P({bt:0.35,bs:-0.65,ft:1.1,fs:0.05,hipDy:-4,bu:-0.3,bf:1.2,fu:0.9,ff:2.4});
  case 'block':case 'blockstun':return P({fu:0.95,ff:3.0,bu:0.75,bf:2.9,lean:-0.06,hipDy:5,head:-0.08});
  case 'hitstun':return P({lean:-0.35,fu:-0.5,ff:0.4,bu:-0.7,bf:0.0,head:-0.3,bt:-0.45,ft:0.15});
  case 'win':return P({fu:2.9,ff:3.1,bu:-0.2,bf:-1.2,lean:-0.05,hipDy:Math.sin(t*0.15)*3,ft:0.15,bt:-0.15});
  case 'ko':return P({lean:0,fu:0.3,ff:0.5,bu:0.2,bf:0.4,bt:-0.05,bs:-0.05,ft:0.1,fs:0.1,head:0.3});
  case 'attack':{const a=f.atk,m=a.m,ph=a.t<m.s?0:(a.t<m.s+m.a?1:2);
    if(a.type==='punch'){if(ph===0)return P({fu:0.35,ff:2.75,lean:-0.1,bu:0.55,bf:2.5,ft:0.2});if(ph===1)return P({fu:1.55,ff:1.57,lean:0.22,bu:0.1,bf:2.6,ft:0.45});return P({fu:1.2,ff:1.8,lean:0.12});}
    if(a.type==='kick'){if(ph===0)return P({ft:1.25,fs:-0.7,lean:-0.2,bu:-0.5,bf:0.9,hipDy:-2});if(ph===1)return P({ft:1.5,fs:1.55,lean:-0.3,bt:-0.12,bs:0,bu:-0.7,bf:0.3,fu:0.6,ff:2.2});return P({ft:1.0,fs:0.4,lean:-0.15});}
    if(f.c.moves.special.proj){ // star toss
      if(ph===0)return P({fu:-2.5,ff:-2.9,lean:-0.18,bu:0.7,bf:1.4,ft:0.5});return P({fu:1.45,ff:1.5,lean:0.28,bu:-0.4,bf:0.6,ft:0.55,bt:-0.5});}
    if(ph===0)return P({lean:0.2,hipDy:10,fu:0.5,ff:1.8,bt:-0.5,ft:0.6,fs:-0.2});
    if(ph===1)return P({lean:0.6,hipDy:10,fu:1.25,ff:1.0,bu:0.5,bf:2.0,ft:0.85,fs:0.2,bt:-0.75,bs:-0.4});
    return P({lean:0.2,hipDy:6});}
  }
  return P({});
}

// ---------- fighter ----------
class Fighter{
  constructor(slot,ci,x,facing){this.slot=slot;this.ci=ci;this.c=CHARS[ci];this.spawn=[x,facing];this.reset();this.pose=P({});}
  reset(){const [x,fc]=this.spawn;Object.assign(this,{x,y:GROUND,vx:0,vy:0,facing:fc,hp:100,dispHp:100,meter:30,state:'idle',t:0,anim:0,atk:null,
    buf:{punch:0,kick:0,special:0},sq:0,sqv:0,lagT:0,pv:{},pp:null,combo:0,koT:0,flash:0,inp:{}});}
  get onGround(){return this.y>=GROUND-0.01;}
  hurt(){const h=(this.state==='attack'&&this.atk.type==='special'&&this.c.moves.special.rush?120:170)*FS;return[this.x-24*FS,this.x+24*FS,this.y-h,this.y];}
  startAttack(type){const m=this.c.moves[type];this.state='attack';this.atk={type,m,t:0,hit:false};this.buf[type]=0;
    if(type==='special'){this.meter-=50;SFX.special(!!this.c.moves.special.proj);flashText(this.c.moves.special.name,this.x,this.y-270,this.c.glow);}else SFX.whiff();}
  update(inp,o){
    this.inp=inp;this.anim++;this.pp=Object.assign({},this.pose);if(this.flash>0)this.flash--;
    for(const k of ['punch','kick','special']){if(this.buf[k]>0)this.buf[k]--;if(inp[k])this.buf[k]=6;}
    const free=!['attack','hitstun','blockstun','ko','win'].includes(this.state);
    if(this.state==='hitstun'||this.state==='blockstun'){if(--this.t<=0&&this.onGround){this.state='idle';this.combo=0;}this.vx*=0.85;}
    else if(this.state==='attack'){const a=this.atk,m=a.m;a.t++;
      if(m.proj&&a.t===m.s){projectiles.push({id:++PID,x:this.x+this.facing*60,y:this.y-130*FS,vx:this.facing*8.5,owner:this,dmg:m.dmg,rot:0,life:140});}
      if(m.rush){if(a.t>=m.s&&a.t<m.s+m.a)this.vx=this.facing*11;else this.vx*=0.7;
        if(a.t>=m.s-2&&a.t<m.s+m.a&&a.t%2===0&&ghosts.length<8){ghosts.push({src:this,x:this.x,y:this.y,facing:this.facing,pose:Object.assign({},this.pose),life:12});netEv('g',[F.indexOf(this),this.x,this.y,this.facing,POSEK.map(k=>this.pose[k])]);}}
      else if(this.onGround)this.vx*=0.7;
      if(m.box&&!a.hit&&a.t>=m.s&&a.t<m.s+m.a){const b=this.hitbox();if(overlap(b,o.hurt())){a.hit=true;resolveHit(this,o,m,this.facing);if(m.rush)this.vx=-this.facing*3;}}
      if(a.t>=m.s+m.a+m.r)this.state=this.onGround?'idle':'jump';}
    else if(free&&this.state!=='ko'){
      if(this.onGround)this.facing=o.x>=this.x?1:-1;
      if(this.onGround&&inp.block){this.state='block';this.vx=0;}
      else if(this.buf.special&&this.meter>=50&&this.onGround)this.startAttack('special');
      else if(this.buf.kick)this.startAttack('kick');
      else if(this.buf.punch)this.startAttack('punch');
      else if(this.onGround){
        const dir=(inp.right?1:0)-(inp.left?1:0);
        if(inp.up){this.vy=-15;this.vx=dir*4.6;this.y-=1;this.state='jump';this.sq=0.14;SFX.jump();}
        else{const sp=dir===this.facing?3.8:3.0;this.vx=dir*sp;this.state=dir?'walk':'idle';}
      }
    }
    if(this.state==='ko'){this.koT++;this.vx*=0.9;}
    // physics
    this.x+=this.vx;if(!this.onGround||this.vy<0){this.vy+=0.8;this.y+=this.vy;}
    if(this.y>=GROUND){this.y=GROUND;if(this.vy>0){if(this.vy>5)this.sq=Math.min(this.sq,-0.18);this.vy=0;if(this.state==='jump'||(this.state==='attack'&&this.atk.type!=='special'))this.state='idle';}}
    this.x=Math.max(LEFT,Math.min(RIGHT,this.x));
    this.meter=Math.min(100,this.meter+0.04);
    if(this.dispHp>this.hp){if(this.lagT>0)this.lagT--;else this.dispHp=Math.max(this.hp,this.dispHp-0.9);}else this.dispHp=this.hp;
    // spring-eased poses (slight overshoot) + squash/stretch spring
    const tp=targetPose(this),atk=this.state==='attack',st=atk?0.42:0.2,dm=atk?0.5:0.6;
    for(const key in tp){const v=((this.pv[key]||0)+(tp[key]-this.pose[key])*st)*dm;this.pv[key]=v;this.pose[key]+=v;}
    this.sqv=(this.sqv-this.sq*0.3)*0.72;this.sq+=this.sqv;
  }
  hitbox(){const b=this.atk.m.box.map(v=>v*FS);const x1=this.x+this.facing*b[0],x2=this.x+this.facing*b[1];return[Math.min(x1,x2),Math.max(x1,x2),this.y+b[2],this.y+b[3]];}
}
function overlap(a,b){return a[0]<b[1]&&a[1]>b[0]&&a[2]<b[3]&&a[3]>b[2];}
function resolveHit(att,def,m,dir){
  if(def.state==='ko')return;

  const px=def.x-dir*14,py=def.y-140;
  if(blocking){def.hp=Math.max(1,def.hp-m.dmg*0.15);def.lagT=30;def.state='blockstun';def.t=m.bs||10;def.vx=dir*(m.kb||5)*0.8;att.meter=Math.min(100,att.meter+2);
    SFX.block();sparks(px,py,'#bfe0ff',10,0.75);impact(px-dir*10,py,'#8fd0ff','block');def.sq=-0.05;shake=Math.max(shake,2.5);hitstop=3;}
  else{const kind=m.dmg>=14?'special':(m.dmg>=10?'heavy':'light');
    def.hp=Math.max(0,def.hp-m.dmg);def.lagT=34;def.state='hitstun';def.t=m.hs||18;def.vx=dir*(m.kb||6);def.flash=6;def.combo++;
    if(!def.onGround||m.dmg>=14){def.vy=-6;def.y-=1;}
    att.meter=Math.min(100,att.meter+6);def.meter=Math.min(100,def.meter+4);
    SFX.hit(m.dmg>=10);sparks(px,py,'#fff3b8',kind==='light'?14:26,kind==='light'?1:1.35);sparks(px,py,att.c.glow,kind==='light'?6:12,0.8);impact(px,py,att.c.glow,kind);
    def.sq=kind==='light'?0.09:0.17;
    shake=Math.max(shake,kind==='light'?5:(kind==='heavy'?9:13));hitstop=kind==='light'?5:(kind==='heavy'?7:9);if(kind!=='light')flashT=Math.max(flashT,2);
    if(def.combo>=2)flashText(def.combo+' HITS!',def.x,def.y-260,'#ffe26a');
    if(def.hp<=0){def.state='ko';def.vy=-8;def.y-=1;def.vx=dir*5;SFX.ko();hitstop=14;flashT=6;shake=16;
      cam.fx=def.x;cam.fy=def.y-140;cam.tz=1.38;sparks(px,py,'#ffffff',30,1.6);impact(px,py,'#ffffff','special');}}
}

// ---------- effects ----------
let PID=0,particles=[],texts=[],projectiles=[],rings=[],ghosts=[],shake=0,hitstop=0,flashT=0;
const PMAX=()=>TOUCH?140:320;
const cam={z:1,tz:1,fx:W/2,fy:H/2,par:0};
function sparks(x,y,c,n,spd=1){netEv('s',[x,y,c,n,spd]);n=Math.round(n*(TOUCH?0.6:1));
  for(let i=0;i<n&&particles.length<PMAX();i++){const a=Math.random()*Math.PI*2,s=(2+Math.random()*7)*spd;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.2,life:16+Math.random()*16,c,w:1.4+Math.random()*2.2});}}
function impact(x,y,c,kind){netEv('i',[x,y,c,kind]);rings.push({x,y,c,kind,t:0,max:kind==='block'?12:(kind==='light'?13:18),rot:Math.random()*Math.PI});}
function flashText(s,x,y,c){netEv('t',[s,x,y,c]);texts.push({s,x,y,c,life:50});}

// ---------- AI (optional practice) ----------
let p2cpu=Q.get('cpu')==='1';const ai={block:0,cd:0};
function aiInput(f,o){const inp={left:false,right:false,up:false,block:false,punch:false,kick:false,special:false};
  const dx=o.x-f.x,d=Math.abs(dx);if(ai.cd>0)ai.cd--;
  const threat=(o.state==='attack'&&d<150)||projectiles.some(p=>p.owner===o&&Math.abs(p.x-f.x)<120);
  if(threat&&ai.block<=0&&Math.random()<0.12)ai.block=18;
  if(ai.block>0){ai.block--;inp.block=true;return inp;}
  if(d>105){if(dx>0)inp.right=true;else inp.left=true;if(f.meter>=50&&Math.random()<0.015)inp.special=true;if(Math.random()<0.006)inp.up=true;}
  else if(ai.cd<=0){const r=Math.random();if(r<0.45)inp.punch=true;else if(r<0.8)inp.kick=true;else if(f.meter>=50)inp.special=true;ai.cd=18+Math.random()*25;}
  else if(Math.random()<0.03){if(dx>0)inp.left=true;else inp.right=true;}
  return inp;}

// ---------- game flow ----------
const F=[new Fighter(0,PICK[0],300,1),new Fighter(1,PICK[1],660,-1)];
let mode='title',phaseT=0,round=1,wins=[0,0],timer=60*60,roundMsg='',paused=false,frame=0,matchWinner=-1,lastWinner=-1;
function newMatch(){wins=[0,0];round=1;startRound();}
function startRound(){F.forEach(f=>f.reset());projectiles=[];particles=[];texts=[];rings=[];ghosts=[];cam.tz=1;cam.z=1;flashT=0;timer=60*60;mode='intro';phaseT=0;SFX.beep(660);}
function endRound(reason){mode='roundEnd';phaseT=0;roundMsg=reason;
  const [a,b]=F;let w=-1;if(a.hp>b.hp)w=0;else if(b.hp>a.hp)w=1;
  if(w<0){wins[0]++;wins[1]++;}else wins[w]++;lastWinner=w;}
function step(){
  frame++;if(flashT>0)flashT--;if(NET.role==='host'&&NET.gin&&mode!=='fight')NET.used=NET.gin.c.slice();if(mode==='title'||(mode==='roundEnd'&&phaseT>100)||mode==='matchEnd')cam.tz=1;cam.z+=(cam.tz-cam.z)*0.09;
  if(mode==='title'){F.forEach((f,i)=>{f.anim++;const tp=targetPose(f);for(const k in tp)f.pose[k]=lerp(f.pose[k],tp[k],0.3);});
    if(netUI||NET.role)return;if(pressed.has('Enter')||pressed.has('Space'))newMatch();if(pressed.has('KeyC'))p2cpu=!p2cpu;return;}
  if(pressed.has('Escape')||pressed.has('KeyP')){if(mode==='fight'||mode==='intro'||mode==='roundEnd')paused=!paused;}
  if(paused){if(pressed.has('Enter'))paused=false,newMatch();if(pressed.has('KeyT')){if(NET.role){netLeave();return;}paused=false;mode='title';F.forEach(f=>f.reset());}return;}
  if(mode==='matchEnd'){phaseT++;tickFighters(false);if(phaseT>40&&pressed.has('Enter'))newMatch();if(pressed.has('Escape')){if(NET.role)netLeave();else mode='title';}return;}
  if(pressed.has('Enter')&&mode!=='intro'){newMatch();return;}
  phaseT++;
  if(mode==='intro'){tickFighters(false);if(phaseT===70)SFX.beep(990);if(phaseT>=100)mode='fight';return;}
  if(mode==='fight'){
    if(hitstop>0){hitstop--;return;}
    tickFighters(true);
    if(--timer<=0){timer=0;endRound('TIME');}
    if(F[0].state==='ko'||F[1].state==='ko')endRound('K.O.');
    return;}
  if(mode==='roundEnd'){
    if(phaseT%3===0||phaseT>60)tickFighters(false);
    if(phaseT===70){F.forEach((f,i)=>{if(f.state!=='ko'&&(lastWinner===i)){f.state='win';f.vx=0;}});}
    if(phaseT>=190){if(wins[0]>=2||wins[1]>=2){mode='matchEnd';phaseT=0;matchWinner=wins[0]>=2&&wins[1]>=2?-1:(wins[0]>=2?0:1);
        F.forEach((f,i)=>{if(i===matchWinner&&f.state!=='ko')f.state='win';});}
      else{round++;startRound();}}
  }
}
function tickFighters(live){
  const none={left:false,right:false,up:false,block:false,punch:false,kick:false,special:false};
  const host=NET.role==='host'&&NET.conn;
  const i0=live?(host?localInput():humanInput(0)):none,i1=live?(host?netGuestInput():(p2cpu?aiInput(F[1],F[0]):humanInput(1))):none;
  F[0].update(i0,F[1]);F[1].update(i1,F[0]);
  // push apart
  const [a,b]=F;if(a.state!=='ko'&&b.state!=='ko'){const dx=b.x-a.x,MD=50*FS;if(Math.abs(dx)<MD&&Math.abs(a.y-b.y)<150){const push=(MD-Math.abs(dx))/2*(dx>=0?1:-1);a.x-=push;b.x+=push;
    a.x=Math.max(LEFT,Math.min(RIGHT,a.x));b.x=Math.max(LEFT,Math.min(RIGHT,b.x));}}
  // projectiles
  for(const p of projectiles){(p.trail||(p.trail=[])).push([p.x,p.y]);if(p.trail.length>14)p.trail.shift();p.x+=p.vx;p.rot+=0.35;p.life--;const def=F.find(f=>f!==p.owner);
    if(p.life>0&&overlap([p.x-16,p.x+16,p.y-16,p.y+16],def.hurt())){p.life=0;resolveHit(p.owner,def,{dmg:p.dmg,hs:22,bs:12,kb:7},Math.sign(p.vx));}
    if(p.x<0||p.x>W)p.life=0;}
  projectiles=projectiles.filter(p=>p.life>0);
  fxTick();
}
function fxTick(){
  for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=0.25;p.vx*=0.95;p.life--;}particles=particles.filter(p=>p.life>0);
  for(const t of texts){t.y-=0.8;t.life--;}texts=texts.filter(t=>t.life>0);
  for(const r of rings)r.t++;rings=rings.filter(r=>r.t<r.max);for(const g of ghosts)g.life--;ghosts=ghosts.filter(g=>g.life>0);
  if(shake>0)shake*=0.85;if(shake<0.4)shake=0;
}

// ---------- drawing helpers ----------
const OUT='#140a1e';
function seg(x,y,a,L){return[x+Math.sin(a)*L,y+Math.cos(a)*L];}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function rrg(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function blob(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=OUT;ctx.fill();ctx.beginPath();ctx.arc(x,y,r-2.2,0,7);ctx.fillStyle=c;ctx.fill();}
const easeOutBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const easeOut=t=>1-Math.pow(1-t,3);

function pieceLocal(pc,x,y){return[(x-pc.sx)/pc.cs+pc.lx0,(y-pc.sy)/pc.cs];}

  for(const pc of PIECES){if(pc.pi===1&&p2cpu&&!NET.role)continue;const [lx,ly]=pieceLocal(pc,x,y),M=16;
    if(lx>=pc.lx0-M&&lx<=pc.lx1+M&&ly>=-M&&ly<=150+M){const d=Math.abs(lx-(pc.lx0+pc.lx1)/2);if(d<bd){bd=d;best=pc;}}}
  return best;}
function zoneActs(pc,x,y){const [lx,ly]=pieceLocal(pc,x,y),acts=new Set();
  let z=pc.zone;
  if(z!=='dpad'&&lx>=TPAD[0]&&lx<=TPAD[2]&&ly>=TPAD[1]&&ly<=TPAD[3]){acts.add('special');return acts;} // touchpad = special
  if(z==='both')z=lx<112?'dpad':'face';
  if(z==='dpad'){const dx=lx-DP[0],dy=ly-DP[1],r=Math.hypot(dx,dy);
    if(r>5){if(dx<-0.38*r)acts.add('left');if(dx>0.38*r)acts.add('right');if(dy<-0.38*r)acts.add('up');}}
  else{let b=null,bd=1e9;for(const [a,fx,fy] of FACE){const d=Math.hypot(lx-fx,ly-fy);if(d<bd){bd=d;b=a;}}acts.add(b);}
  return acts;}
function touchUpdate(id,x,y,start){

  if(!t)return false;
  const na=zoneActs(t.piece,x,y);
  for(const a of na)if(!t.acts.has(a)&&(a==='punch'||a==='kick'||a==='special'))TT[t.pi].add(a);
  t.acts=na;return true;}

const PEER_SRC=['https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js','https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js'];

function iceConfig(){const ice=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun2.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}];
  if(Q.get('turn'))ice.push({urls:Q.get('turn'),username:Q.get('tu')||'',credential:Q.get('tp')||''}); // optional user-supplied TURN
  return{iceServers:ice};}
function genCode(){let s='';for(let i=0;i<5;i++)s+=CODE_ABC[Math.floor(Math.random()*CODE_ABC.length)];return s;}
function cleanCode(s){return(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);}

function netSend(o){const c=NET.conn;if(c&&c.open){try{c.send(o);}catch(e){}}}

function netReset(){const n=NET;clearTimeout(n.timer);try{n.conn&&n.conn.close();}catch(e){}try{n.peer&&n.peer.destroy();}catch(e){}
  Object.assign(n,{role:null,peer:null,conn:null,code:'',live:false,buf:[],gin:null,used:[0,0,0],tc:[0,0,0],ev:[],evId:0,lastEv:0,ping:0,lastRx:0,lastPing:0,clk:0,seq:0,ptrail:{},tick:0,timer:0});}
function netFail(msg){const wasOnline=!!NET.role;netReset();clearTimeout(NET.timer);paused=false;
  if(mode!=='title'){goTitle();}F[0].ci=PICK[0];F[0].c=CHARS[PICK[0]];F[1].ci=PICK[1];F[1].c=CHARS[PICK[1]];
  projectiles=[];particles=[];rings=[];ghosts=[];texts=[];cam.z=cam.tz=1;layout();netSetUI('error',msg||(wasOnline?'Disconnected.':'Connection failed.'));}
addEventListener('pagehide',()=>netSend({t:'bye'}));

function wireConn(conn){
  conn.on('data',d=>{NET.lastRx=performance.now();onNetData(d);});
  conn.on('close',()=>{if(NET.conn===conn)netFail(NET.role==='host'?'Your friend left the match.':'The host left the match.');});

async function netHost(tries=0){
  netReset();netSetUI('hosting','Connecting to server…');
  try{await loadPeer();}catch(e){netSetUI('error',e.message);return;}
  const code=genCode();NET.role='host';NET.code=code;
  const peer=new Peer(ROOM_PREFIX+code,{config:iceConfig(),debug:0});NET.peer=peer;
  peer.on('open',()=>{if(NET.peer!==peer)return;netSetUI('hosting','Waiting for a friend to join…');});
  peer.on('error',e=>{if(NET.peer!==peer)return;
    if(e.type==='unavailable-id'&&tries<4){netHost(tries+1);return;}
    if(NET.conn&&NET.conn.open&&e.type!=='peer-unavailable')return; // broker hiccup after we are already connected: ignore
    netFail(e.type==='network'||e.type==='server-error'||e.type==='socket-error'?'Can\'t reach the matchmaking server. Check your internet and try again.':'Online error: '+e.type);});
  peer.on('disconnected',()=>{if(NET.peer===peer&&!NET.conn)try{peer.reconnect();}catch(e){}});
  peer.on('connection',conn=>{
    if(NET.conn){conn.on('open',()=>{conn.send({t:'full'});setTimeout(()=>conn.close(),300);});return;}
    NET.conn=conn;netSetUI('hosting','Friend found — connecting…');
    clearTimeout(NET.timer);NET.timer=setTimeout(()=>{if(NET.conn===conn&&!conn.open){NET.conn=null;try{conn.close();}catch(e){}netSetUI('hosting','Couldn\'t connect to that player (network/NAT). Still waiting…');}},15000);
    wireConn(conn);
    conn.on('open',()=>{if(NET.conn!==conn)return;clearTimeout(NET.timer);NET.lastRx=performance.now();netSend({t:'hello',v:1});
      initAudio();p2cpu=false;paused=false;netSetUI(null,'');layout();newMatch();});});}

  netReset();netSetUI('joining','Connecting to server…');NET.code=code;
  try{await loadPeer();}catch(e){netSetUI('error',e.message);return;}
  NET.role='guest';const peer=new Peer({config:iceConfig(),debug:0});NET.peer=peer;
  peer.on('error',e=>{if(NET.peer!==peer)return;if(NET.live&&e.type!=='peer-unavailable')return;
    netFail(e.type==='peer-unavailable'?'Room '+code+' not found. Check the code — the host must keep the game open.':(e.type==='network'||e.type==='server-error'||e.type==='socket-error'?'Can\'t reach the matchmaking server. Check your internet.':'Online error: '+e.type));});
  peer.on('open',()=>{if(NET.peer!==peer)return;netSetUI('joining','Found server — joining room '+code+'…');
    const conn=peer.connect(ROOM_PREFIX+code,{reliable:false,serialization:'json'});NET.conn=conn;wireConn(conn);
    clearTimeout(NET.timer);NET.timer=setTimeout(()=>{if(NET.conn===conn&&!NET.live)netFail('Couldn\'t connect directly to the host. One of your networks may block peer-to-peer (strict NAT/firewall). Try another Wi-Fi or mobile data.');},16000);
    conn.on('open',()=>{if(NET.conn!==conn)return;NET.lastRx=performance.now();initAudio();netSend({t:'hi',v:1});netSetUI('joining','Connected — starting match…');layout();});});}
function bitsOf(i){return(i.left?1:0)|(i.right?2:0)|(i.up?4:0)|(i.block?8:0)|(i.punch?16:0)|(i.kick?32:0)|(i.special?64:0);}
function inpOf(b){return{left:!!(b&1),right:!!(b&2),up:!!(b&4),block:!!(b&8),punch:!!(b&16),kick:!!(b&32),special:!!(b&64)};}
// local device input = both keyboard layouts + this device's touch pad
function localInput(){const a=humanInput(0),b=humanInput(1),o={};for(const k in a)o[k]=a[k]||b[k];return o;}
function localHeld(a){return held(0,a)||held(1,a);}
function netGuestInput(){const g=NET.gin,none={left:false,right:false,up:false,block:false,punch:false,kick:false,special:false};if(!g)return none;
  const i=inpOf(g.b&15);['punch','kick','special'].forEach((k,j)=>{if(g.c[j]>NET.used[j]){i[k]=true;NET.used[j]=g.c[j];}});return i;}
const R2=v=>Math.round(v*100)/100;
function netSnapshot(){
  const fa=f=>[R2(f.x),R2(f.y),f.facing,R2(f.hp),R2(f.dispHp),R2(f.meter),f.state,f.anim,f.koT,f.flash,f.combo,f.atk&&f.state==='attack'?f.atk.type:'',R2(f.sq||0),POSEK.map(k=>Math.round(f.pose[k]*1000)/1000),bitsOf(f.inp||{})];
  return{t:'s',fr:frame,m:mode,ph:phaseT,r:round,w:wins,tm:timer,pa:paused?1:0,mw:matchWinner,lw:lastWinner,rm:roundMsg,sh:R2(shake),fl:flashT,
    cz:Math.round(cam.z*1000)/1000,cx:R2(cam.fx),cy:R2(cam.fy),ch:[F[0].ci,F[1].ci],f:F.map(fa),p:projectiles.map(p=>[p.id,R2(p.x),R2(p.y),R2(p.rot),F.indexOf(p.owner)]),
    ev:NET.ev.filter(e=>e[1]>=frame-10)};}
function onNetData(d){if(!d||typeof d!=='object')return;
  if(d.t==='pi'){netSend({t:'po',ts:d.ts});return;}
  if(d.t==='bye'){netFail(NET.role==='host'?'Your friend left the match.':'The host left the match.');return;}
  if(d.t==='po'){const rtt=performance.now()-d.ts;NET.ping=NET.ping?NET.ping*0.7+rtt*0.3:rtt;return;}
  if(NET.role==='host'){
    if(d.t==='i'){if(!NET.gin||d.q>NET.gin.q)NET.gin=d;}
    else if(d.t==='pause'){if(mode==='fight'||mode==='intro'||mode==='roundEnd')paused=d.v===undefined?!paused:!!d.v;}
    else if(d.t==='rematch'){if(mode==='matchEnd'||paused){paused=false;newMatch();}}
    return;}
  // guest
  if(d.t==='full'){netFail('That room already has two players.');return;}
  if(d.t==='s'){
    if(!NET.live){NET.live=true;netSetUI(null,'');p2cpu=false;layout();NET.clk=d.fr-4;}
    for(const e of d.ev||[])if(e[0]>NET.lastEv){NET.lastEv=e[0];applyEv(e[2],e[3]);}
    const b=NET.buf;if(b.length&&d.fr<=b[b.length-1].fr){if(!b.some(s=>s.fr===d.fr)){b.push(d);b.sort((x,y)=>x.fr-y.fr);}}else b.push(d);
    if(b.length>10)b.splice(0,b.length-10);}}
function applyEv(type,a){
  if(type==='s')sparks(...a);else if(type==='i')impact(...a);else if(type==='t')flashText(...a);
  else if(type==='a'){const f=SFX[a[0]];if(f)f(...a[1]);}
  else if(type==='g'){const pose={};POSEK.forEach((k,i)=>pose[k]=a[4][i]);if(ghosts.length<8)ghosts.push({src:F[a[0]],x:a[1],y:a[2],facing:a[3],pose,life:12});}}
const lerpN=(a,b,t)=>a+(b-a)*t;
function guestApply(){const b=NET.buf;if(!b.length)return;
  const target=b[b.length-1].fr-4;if(Math.abs(NET.clk-target)>20)NET.clk=target;else NET.clk+=1+(target-NET.clk)*0.05;
  let A=b[0],B=b[0];for(let i=0;i<b.length;i++){if(b[i].fr<=NET.clk)A=b[i];if(b[i].fr>=NET.clk){B=b[i];break;}B=b[i];}
  const t=B.fr>A.fr?Math.max(0,Math.min(1,(NET.clk-A.fr)/(B.fr-A.fr))):1,N=t<0.5?A:B;
  mode=N.m;phaseT=Math.round(lerpN(A.ph,B.ph,t));round=N.r;wins=N.w;timer=N.tm;paused=!!N.pa;matchWinner=N.mw;lastWinner=N.lw;roundMsg=N.rm;
  shake=N.sh;flashT=N.fl;cam.z=lerpN(A.cz,B.cz,t);cam.tz=cam.z;cam.fx=N.cx;cam.fy=N.cy;
  for(let i=0;i<2;i++){const f=F[i],fa=A.f[i],fb=B.f[i],fn=N.f[i];
    if(f.ci!==N.ch[i]){f.ci=N.ch[i];f.c=CHARS[f.ci];}
    f.pp=Object.assign({},f.pose);
    f.x=lerpN(fa[0],fb[0],t);f.y=lerpN(fa[1],fb[1],t);f.facing=fn[2];f.hp=lerpN(fa[3],fb[3],t);f.dispHp=lerpN(fa[4],fb[4],t);f.meter=lerpN(fa[5],fb[5],t);
    f.state=fn[6];f.anim=fn[7];f.koT=fn[8];f.flash=fn[9];f.combo=fn[10];f.atk=fn[11]?{type:fn[11],t:0,m:f.c.moves[fn[11]]}:null;f.sq=lerpN(fa[12],fb[12],t);
    POSEK.forEach((k,j)=>f.pose[k]=lerpN(fa[13][j],fb[13][j],t));f.inp=inpOf(fn[14]);}
  const pa=new Map(A.p.map(p=>[p[0],p])),np=[];
  for(const p of B.p){const q=pa.get(p[0])||p,x=lerpN(q[1],p[1],t),y=lerpN(q[2],p[2],t),tr=NET.ptrail[p[0]]||(NET.ptrail[p[0]]=[]);tr.push([x,y]);if(tr.length>14)tr.shift();
    np.push({id:p[0],x,y,rot:lerpN(q[3],p[3],t),owner:F[p[4]],trail:tr,life:1});}
  projectiles=np;}
function guestStep(){frame++;
  const li=localInput();if(li.punch)NET.tc[0]++;if(li.kick)NET.tc[1]++;if(li.special)NET.tc[2]++;
  netSend({t:'i',b:bitsOf(li)&15,c:NET.tc.slice(),q:++NET.seq});
  if(pressed.has('Escape')||pressed.has('KeyP'))netSend({t:'pause'});
  if(pressed.has('Enter')&&(mode==='matchEnd'||paused))netSend({t:'rematch'});
  guestApply();fxTick();}
function netTick(stepped){const now=performance.now();
  if(NET.conn&&NET.conn.open){
    if(now-NET.lastPing>1000){NET.lastPing=now;netSend({t:'pi',ts:now});}
    if(NET.role==='host'&&stepped&&(++NET.tick%2===0))netSend(netSnapshot());
    if(NET.lastRx&&now-NET.lastRx>6000)netFail('Connection lost (no data for 6 s).');}}
function drawNetHUD(){if(!NET.role||!NET.conn)return;const me=NET.role==='host'?'HOST · P1':'GUEST · P2',ms=Math.round(NET.ping||0);
  const col=ms<80?'#7dffb0':ms<160?'#ffe26a':'#ff7a8a';const s=`🌐 ONLINE · ${me} · PING ${NET.ping?ms+' ms':'…'}`;
  ctx.save();ctx.font="800 11px system-ui,'Segoe UI',sans-serif";const w=ctx.measureText(s).width+24;rr(W/2-w/2,524,w,20,10);ctx.fillStyle='rgba(15,5,35,0.6)';ctx.fill();ctx.strokeStyle=hexA(col,0.7);ctx.lineWidth=1.2;ctx.stroke();ctx.restore();
  txt(s,W/2,534.5,11,col,'800');}
function netPanelHTML(){const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const st=NET.status?`<div class="nst">${esc(NET.status)}</div>`:'';
  if(netUI==='menu')return`<div class="nh">PLAY ONLINE</div><button data-a="host" class="pri">🏠 HOST A ROOM</button>
    <div class="nrow"><input id="roomIn" maxlength="8" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false"><button data-a="join">JOIN</button></div>${st}<button data-a="back">BACK</button>`;
  if(netUI==='hosting'){const link=NET.code?roomLink(NET.code):'';return`<div class="nh">ROOM CODE</div><div class="ncode">${NET.code||'·····'}</div>
    <div class="nlink">${esc(link)}</div><div class="nrow"><button data-a="copy">📋 COPY LINK</button>${navigator.share?'<button data-a="share">📤 SHARE</button>':''}</div>${st}<button data-a="cancel">CANCEL</button>`;}
  if(netUI==='joining')return`<div class="nh">JOINING ${esc(NET.code)}</div>${st}<button data-a="cancel">CANCEL</button>`;
  if(netUI==='error')return`<div class="nh">ONLINE</div><div class="nst err">${esc(NET.status)}</div><button data-a="netok" class="pri">OK</button>`;
  return'';}
function copyLink(){const link=roomLink(NET.code);const done=()=>{NET.status='Link copied! Send it to your friend. Waiting…';uiKey='';};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(link).then(done,()=>prompt('Copy this link:',link));else prompt('Copy this link:',link);}
function shareLink(){const link=roomLink(NET.code);navigator.share({title:'Bedroom Brawl',text:'Fight me in Bedroom Brawl! Room '+NET.code,url:link}).catch(()=>{});}
Object.assign(ACTIONS,{online:()=>{initAudio();netSetUI('menu','');},host:()=>netHost(),join:()=>{const i=document.getElementById('roomIn');netJoin(i?i.value:'');},
  copy:copyLink,share:shareLink,cancel:netLeave,back:()=>netSetUI(null,''),netok:()=>netSetUI('menu',''),leave:netLeave});
// online-aware versions of the pause/match actions
{const base={resume:ACTIONS.resume,restart:ACTIONS.restart,rematch:ACTIONS.rematch,title:ACTIONS.title};
  ACTIONS.resume=()=>NET.role==='guest'?netSend({t:'pause',v:false}):base.resume();
  ACTIONS.restart=()=>NET.role==='guest'?netSend({t:'rematch'}):base.restart();
  ACTIONS.rematch=()=>NET.role==='guest'?netSend({t:'rematch'}):base.rematch();
  ACTIONS.title=()=>NET.role?netLeave():base.title();}

layout();

// ---------- loop ----------
let acc=0,last=performance.now();
// adaptive quality: if frames stay slow (>~22ms avg) during a fight, drop to the LITE baked-stage path once
let ftEma=16.7,slowN=0;
function adapt(dt){if(LITE||Q.get('hq')==='1'||document.hidden||mode!=='fight'||paused)return;ftEma+=(Math.min(100,dt)-ftEma)*0.05;
  if(ftEma>22){if(++slowN>90){LITE=true;buildBG();slowN=0;console.log('Bedroom Brawl: switched to lite rendering');}}else slowN=Math.max(0,slowN-1);}
function loop(now){adapt(now-last);acc+=Math.min(100,now-last);last=now;let st=0;while(acc>=1000/60){if(NET.role==='guest'&&NET.live)guestStep();else step();st++;pressed.clear();TT[0].clear();TT[1].clear();acc-=1000/60;}netTick(st>0);render();renderPads();syncUI();requestAnimationFrame(loop);}
window.__game={F,get mode(){return mode},set mode(v){mode=v},step,render,newMatch,setP2cpu:v=>p2cpu=v,get wins(){return wins},
  press:c=>pressed.add(c),hold:c=>down.add(c),release:c=>down.delete(c),
  get paused(){return paused},get p2cpu(){return p2cpu},get touch(){return TOUCH},get pieces(){return PIECES},get lite(){return LITE},NET,get netUI(){return netUI},netHost,netJoin,netLeave,TP,tHeld,layout,ROSTER,PICK};
loadAll(()=>{buildBG();
  if(Q.get('preview')){previewMode();return;}
  requestAnimationFrame(loop);if(Q.get('room'))netJoin(Q.get('room'));});
function previewMode(){mode='preview';ctx.setTransform(SCALE,0,0,SCALE,0,0);drawWorld();
  F[0].x=380;F[1].x=590;F[0].facing=1;F[1].facing=-1;for(let i=0;i<40;i++)F.forEach(f=>{f.anim++;const tp=targetPose(f);for(const k in tp)f.pose[k]=lerp(f.pose[k],tp[k],0.3);});
  F.forEach(drawFighterShadow);F.forEach(f=>drawFighter(f));bigText(F[0].c.name,380,130,30,'#ff9ad8');bigText(F[1].c.name,590,130,30,'#a9c8ff');window.__ready=true;}
